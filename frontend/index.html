    <script>
      // Hide AI bot on specific pages
      (function () {
        // Define pages where you want to hide the AI bot
        const hiddenPages = [
          '/chat',
          '/payment',
          '/login',
          '/register',
          '/admin',
          '/dashboard',
        ];

        // Get current page path
        const currentPath = window.location.pathname;

        // Check if current page should hide the bot
        const shouldHide = hiddenPages.some(
          (page) => currentPath.includes(page) || currentPath === page
        );

        if (shouldHide) {
          // Wait for DOM to be ready
          function hideBot() {
            const botContainer = document.querySelector(
              '.embedded-agent-container'
            );
            if (botContainer) {
              botContainer.style.display = 'none';
            }
          }

          // Try immediately and also wait for DOM
          hideBot();
          document.addEventListener('DOMContentLoaded', hideBot);

          // Also use MutationObserver in case bot loads later
          const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
              mutation.addedNodes.forEach(function (node) {
                if (node.nodeType === 1) {
                  const botContainer =
                    node.querySelector?.('.embedded-agent-container') ||
                    (node.classList?.contains('embedded-agent-container')
                      ? node
                      : null);
                  if (botContainer) {
                    botContainer.style.display = 'none';
                  }
                }
              });
            });
          });
          observer.observe(document.body, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="google_translate_element"
      style="position: absolute; top: 100px; right: 10px; z-index: 10"
    ></div>

    <!-- Google Translate -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: 'en',
            includedLanguages: 'en,hi',
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          },
          'google_translate_element'
        );
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <!-- Main App -->

    <script src="https://www.noupe.com/embed/0198237dc2247d588fa06f4082da701c23c3.js"></script>
